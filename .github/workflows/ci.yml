name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: scripts (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pip install pytest
      - run: python3 -m pytest -q

  template:
    name: template (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/cut/template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skills/cut/template/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
