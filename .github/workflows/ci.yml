name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Werkzeuge (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skills/schnitt/template/package-lock.json
      - name: ffmpeg und zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zsh
      - name: Vorlage installieren (für den Gerüst-Test)
        run: npm ci
        working-directory: skills/schnitt/template
      - run: pip install pytest numpy pillow
      - run: python3 -m pytest -q

  template:
    name: Vorlage (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/schnitt/template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skills/schnitt/template/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
