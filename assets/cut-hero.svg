<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">claude-cut cinematic video editing hero</title>
  <desc id="desc">A vertical talking-head video frame in a dark cinematic editing room, surrounded by film and interface elements.</desc>
  <defs>
    <linearGradient id="spotlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="phoneClip">
      <rect x="477" y="34" width="246" height="352" rx="25"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="#0A0A0A"/>
  <polygon points="40,0 410,0 700,420 188,420" fill="url(#spotlight)"/>

  <!-- Left film strip -->
  <g opacity="0.58" transform="rotate(-8 190 210)">
    <rect x="88" y="82" width="195" height="256" rx="8" fill="#161616" stroke="#9C9C9C" stroke-width="2"/>
    <rect x="116" y="104" width="139" height="212" fill="#0A0A0A" stroke="#9C9C9C" stroke-width="2"/>
    <g fill="#9C9C9C">
      <rect x="96" y="101" width="12" height="22" rx="2"/><rect x="263" y="101" width="12" height="22" rx="2"/>
      <rect x="96" y="137" width="12" height="22" rx="2"/><rect x="263" y="137" width="12" height="22" rx="2"/>
      <rect x="96" y="173" width="12" height="22" rx="2"/><rect x="263" y="173" width="12" height="22" rx="2"/>
      <rect x="96" y="209" width="12" height="22" rx="2"/><rect x="263" y="209" width="12" height="22" rx="2"/>
      <rect x="96" y="245" width="12" height="22" rx="2"/><rect x="263" y="245" width="12" height="22" rx="2"/>
      <rect x="96" y="281" width="12" height="22" rx="2"/><rect x="263" y="281" width="12" height="22" rx="2"/>
    </g>
    <path d="M116 168H255M116 247H255" stroke="#9C9C9C" stroke-width="2"/>
    <circle cx="185" cy="208" r="26" fill="#161616" stroke="#D97757" stroke-width="5"/>
    <polygon points="178,193 178,223 202,208" fill="#D97757"/>
  </g>

  <!-- Left floating chat card -->
  <g>
    <rect x="262" y="62" width="168" height="84" rx="12" fill="#161616" stroke="#9C9C9C" stroke-width="2"/>
    <polygon points="294,146 316,146 298,164" fill="#161616" stroke="#9C9C9C" stroke-width="2"/>
    <path d="M294 146H316" stroke="#161616" stroke-width="4"/>
    <circle cx="292" cy="91" r="6" fill="#D97757"/>
    <rect x="309" y="84" width="91" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="285" y="111" width="111" height="5" rx="2.5" fill="#9C9C9C"/>
    <rect x="285" y="124" width="76" height="5" rx="2.5" fill="#9C9C9C"/>
  </g>

  <!-- Right clapperboard -->
  <g opacity="0.7" transform="rotate(7 999 173)">
    <rect x="902" y="122" width="190" height="139" rx="6" fill="#161616" stroke="#9C9C9C" stroke-width="2"/>
    <rect x="896" y="91" width="202" height="44" rx="5" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="906,94 939,94 916,132 899,132" fill="#0A0A0A"/>
    <polygon points="960,94 993,94 970,132 937,132" fill="#0A0A0A"/>
    <polygon points="1014,94 1047,94 1024,132 991,132" fill="#0A0A0A"/>
    <polygon points="1068,94 1095,94 1095,105 1078,132 1045,132" fill="#0A0A0A"/>
    <rect x="920" y="157" width="84" height="7" rx="3" fill="#9C9C9C"/>
    <rect x="920" y="179" width="145" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="920" y="201" width="115" height="6" rx="3" fill="#9C9C9C"/>
    <path d="M920 231H1068" stroke="#D97757" stroke-width="6"/>
  </g>

  <!-- Version badge -->
  <g>
    <rect x="802" y="274" width="188" height="52" rx="26" fill="#161616" stroke="#9C9C9C" stroke-width="2"/>
    <circle cx="832" cy="300" r="16" fill="#D97757"/>
    <text x="832" y="305" text-anchor="middle" fill="#0A0A0A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="900">v1</text>
    <text x="883" y="306" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="900">v2</text>
    <text x="946" y="306" text-anchor="middle" fill="#9C9C9C" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="900">v3</text>
    <path d="M858 288V312M916 288V312" stroke="#9C9C9C" stroke-width="1"/>
  </g>

  <!-- Center phone -->
  <rect x="465" y="22" width="270" height="376" rx="34" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="4"/>
  <g clip-path="url(#phoneClip)">
    <!-- Upper graphic zone -->
    <rect x="477" y="34" width="246" height="208" fill="#161616"/>
    <path d="M477 242H723" stroke="#D97757" stroke-width="8"/>

    <!-- Terminal card -->
    <rect x="493" y="49" width="214" height="45" rx="7" fill="#0A0A0A" stroke="#9C9C9C" stroke-width="1.5"/>
    <circle cx="514" cy="71" r="9" fill="#5FB37A"/>
    <path d="M509 71L513 75L520 67" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square"/>
    <text x="532" y="76" fill="#9C9C9C" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">CUT READY · 00:12</text>

    <!-- Poster hard shadow -->
    <text x="497" y="134" fill="#0A0A0A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="-1">CLAUDE</text>
    <text x="497" y="172" fill="#0A0A0A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="-1">CUT THIS</text>
    <text x="493" y="129" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="-1">CLAUDE</text>
    <text x="493" y="167" fill="#D97757" font-family="Inter, Helvetica, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="-1">CUT THIS</text>

    <!-- Timeline strip -->
    <rect x="493" y="185" width="214" height="40" rx="5" fill="#0A0A0A"/>
    <path d="M503 202H697" stroke="#9C9C9C" stroke-width="2"/>
    <path d="M517 196V209M545 198V207M574 194V211M612 198V207M643 194V211M680 198V207" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="503" y="199" width="72" height="6" fill="#D97757"/>
    <text x="503" y="219" fill="#9C9C9C" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700">word</text>
    <text x="665" y="219" fill="#9C9C9C" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700">frame</text>

    <!-- Lower talking-head zone -->
    <rect x="477" y="246" width="246" height="140" fill="#9C9C9C"/>
    <polygon points="477,246 723,246 723,282 477,320" fill="#D97757" opacity="0.78"/>
    <circle cx="600" cy="299" r="37" fill="#161616"/>
    <path d="M522 386C530 334 558 322 600 322C642 322 670 334 678 386Z" fill="#161616"/>
    <path d="M578 322L600 347L622 322" fill="#0A0A0A"/>
    <rect x="509" y="348" width="182" height="27" rx="4" fill="#FFFFFF"/>
    <text x="600" y="366" text-anchor="middle" fill="#0A0A0A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="900">FRAME-EXACT. WORD-SYNCED.</text>
  </g>
  <rect x="566" y="28" width="68" height="7" rx="3.5" fill="#0A0A0A"/>

  <!-- Editing-room accents -->
  <path d="M333 206H429M347 220H407" stroke="#9C9C9C" stroke-width="2" opacity="0.55"/>
  <circle cx="423" cy="206" r="6" fill="#D97757"/>
  <path d="M773 82H857M786 96H834" stroke="#9C9C9C" stroke-width="2" opacity="0.55"/>
  <rect x="849" y="76" width="9" height="12" fill="#D97757"/>

  <text x="1160" y="382" text-anchor="end" fill="#FFFFFF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">/cut  ·  claude-cut</text>
</svg>
